[package]
name = "vgd-core"
version.workspace = true
edition.workspace = true
description = "Very Good Downloader: ядро, общее для Windows и Android (yt-dlp + ffmpeg)"

[lib]
name = "vgd_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
# HTTP вместо curl.exe: rustls + встроенные корневые сертификаты, gzip, SOCKS-прокси
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "socks-proxy"] }

[target.'cfg(windows)'.dependencies]
# только системный прокси Windows (net.rs)
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
# Linux/Android: место на диске (statvfs), остановка группы процессов, местное время
libc = "0.2"
