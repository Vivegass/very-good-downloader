[package]
name = "vgd"
version = "1.9.0"
edition = "2021"
description = "Very Good Downloader: скачивание с YouTube (yt-dlp + ffmpeg)"
build = "build.rs"

[lib]
name = "vgd"
path = "src/lib.rs"

# Консоль: vgd.exe
[[bin]]
name = "vgd"
path = "src/bin/vgd.rs"

# Окно: при упаковке переименовывается в «Very Good Downloader.exe»
[[bin]]
name = "vgd-gui"
path = "src/bin/vgd-gui.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
lexopt = "0.3"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit"] }
rfd = "0.17"
arboard = { version = "3", default-features = false }
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
