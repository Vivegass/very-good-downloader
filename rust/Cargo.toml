# Very Good Downloader — рабочее пространство:
#   core    — ядро (vgd-core): загрузка, музыка, сортировка, настройки, темы, очередь; без окна и Windows-API
#   desktop — программа для Windows (vgd): окно vgd-gui, консоль vgd, трей, расширение, WebView2
#   android — библиотека libvgd.so для APK (UniFFI), собирается cargo-ndk
[workspace]
resolver = "2"
members = ["core", "desktop", "android", "uniffi-bindgen"]
# `cargo build --release` / `cargo test --lib` в rust/ — как раньше, версия для ПК.
default-members = ["core", "desktop"]

[workspace.package]
version = "1.15.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# libvgd.so для APK: как release, но паника в Rust не роняет приложение (UniFFI превращает её в исключение Kotlin)
[profile.android]
inherits = "release"
panic = "unwind"
# таблица символов нужна uniffi-bindgen (метаданные); отладочные сведения убираем, AGP ещё раз обрежет .so
strip = "debuginfo"
